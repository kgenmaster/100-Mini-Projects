<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(20, 18, 18);
        }
        .wrapper {
            position: relative;
            padding: 10px;
            background: url('Art.jpg');
            background-size:cover;
            background-position: center;
            height: 90%;
            aspect-ratio: 1/1;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
        }
        .dashboard {
            margin-top: 5%;
        }

        .hintbtn {
            background-color: rgb(99, 182, 157);
            color: black;
            font-size: 1em;
            font-weight: bold;
            padding: 10px 25px;
            border-radius: 5px;
        }
        .submitbtn {
            background-color: rgb(110, 156, 255);
            color: black;
            font-size: 1em;
            font-weight: bold;
            padding: 10px 25px;
            border-radius: 5px;
            width: 100%;
        }
        #inputLine {
            font-size: 1em;
            background-color: transparent;
            text-align: center;
            width: fit-content;
            border: none;
            border-bottom: 5px solid rgb(79, 201, 89);
            outline: none;
            padding-bottom: 5px;
            margin: 10px 10px;
            color: white;
        }
        #inputLine::placeholder {
            font-weight: bold;
            color: rgb(196, 196, 196);
        }
        .dashboard {
            display: flex;
            justify-content: space-between;
        }
        .emojiReaction {
            border: thin solid rgb(116, 116, 116);
            flex-grow: 1;
            width: 100%;
        }
        .score {
            margin-top: 10px;
            height: 30px;
            border: thin solid rgb(116, 116, 116);
            display: flex;
            justify-content: space-evenly;
            font-weight: bold;
        }
        .lowerContainer {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            align-items: center;
        }
        .message {
            margin: 10px 0;
            font-size: 1em;
            font-weight: bolder;
        }
    </style>
</head>
<body>

            <button class="hintbtn">Hint</button>

            <button class="submitbtn">Submit</button>
        </div>

    </div>

</body>
</html>
