<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial;
            color: darkorange;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
        }

        .wrapper {
            display: grid;
            gap: 1px; /* Space between grid cells */
            background-color: #ffffff;
            border-radius: 10px;
        }

        .grid {
            width: 25px;
            height: 25px;
			border: thin solid #aaa;
            font-size: 12px;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .snake {
            background-color: rgb(0, 0, 0);
        }

        .food {
            background-color: rgb(255, 226, 3);
        }
    </style>
</head>
<body>
    <h1>Score = <span class="score">0</span></h1>
    <div class="wrapper"></div>

    <script>
        const gridSize = 20; // Reduced grid size for better gameplay
        const wrapper = document.querySelector('.wrapper');
        let score = document.querySelector('.score')
        let counter = 0
        // Set the grid template dynamically
        wrapper.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;
        wrapper.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;

        // Create the grid
        for (let row = 0; row < gridSize; row++) {
            for (let col = 0; col < gridSize; col++) {
                const element = document.createElement('div');
                element.classList.add('grid');
                element.textContent = counter;
                wrapper.appendChild(element);
                counter++;
            }
        }



        const gridCells = document.querySelectorAll('.grid');
        console.log(gridCells)
        let snake = [{ row: 10, col: 10 }]; // Start snake in the middle
        let direction = { row: 0, col: 1 }; // Initial direction (right)
        let gameInterval;

        function startGame() {
            snake = [{ row: 10, col: 10 }]; // Reset snake position
            direction = { row: 0, col: 1 }; // Reset direction
            generateFood(); // Generate new food
            render(); // Render the initial state
            clearInterval(gameInterval); // Clear any existing interval
            gameInterval = setInterval(moveSnake, 70); // Start the game loop
            score.textContent = 0
        }

        function render() {
            gridCells.forEach(cell => cell.classList.remove('snake', 'food'));
            snake.forEach(segment => {
                const index = segment.row * gridSize + segment.col;
                gridCells[index].classList.add('snake');
            });
            const foodIndex = food.row * gridSize + food.col;
            gridCells[foodIndex].classList.add('food');
        }

        function moveSnake() {
            const head = { ...snake[0] };
            head.row += direction.row;
            head.col += direction.col;

            if (
                head.row < 0 || head.row >= gridSize ||
                head.col < 0 || head.col >= gridSize ||
                snake.some(segment => segment.row === head.row && segment.col === head.col)
            ) {
                clearInterval(gameInterval);
                return;
            }

            snake.unshift(head);

            if (head.row === food.row && head.col === food.col) {
                generateFood();
                score.textContent = parseInt(score.textContent) + 1
            } else {
                snake.pop();
            }

            render();
        }

        function generateFood() {
            let newFood;
            do {
                newFood = {
                    row: Math.floor(Math.random() * gridSize),
                    col: Math.floor(Math.random() * gridSize)
                };
            } while (snake.some(segment => segment.row === newFood.row && segment.col === newFood.col));

            food = newFood;
        }

        document.addEventListener('keydown', (event) => {
            switch (event.key) {
                case 'ArrowUp':
                    if (direction.row !== 1) direction = { row: -1, col: 0 };
                    break;
                case 'ArrowDown':
                    if (direction.row !== -1) direction = { row: 1, col: 0 };
                    break;
                case 'ArrowLeft':
                    if (direction.col !== 1) direction = { row: 0, col: -1 };
                    break;
                case 'ArrowRight':
                    if (direction.col !== -1) direction = { row: 0, col: 1 };
                    break;
            }
        });



        document.addEventListener('keydown', (event) => {
            if (event.key === " ") { // Start game on spacebar
                startGame();
            }
        });

        // Initial render (optional)
    </script>
</body>
</html>
