<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Hover Label</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ffffff, #ac3535);
        font-family: sans-serif;
      }

      #container {
        position: relative;
        padding: 12px 24px;
        font-size: 28px;
        font-weight: 600;
        cursor: pointer;
        color: white;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: all 0.3s ease;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      #container:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        background: rgba(255, 255, 255, 0.15);
      }

      #tip {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%) scale(0.9);
        background: linear-gradient(135deg, #2c3e50, #4a235a);
        color: #fff;
        white-space: nowrap;
        padding: 12px 20px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 500;
        visibility: hidden;
        opacity: 0;
        transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      #tip::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 100%;
        transform: translateX(-50%);
        border: 8px solid;
        border-color: #2c3e50 transparent transparent transparent;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.1));
        transition: all 0.3s ease;
        opacity: 0;
      }

      #container:hover #tip {
        top: -100%;
        visibility: visible;
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }

      #container:hover #tip::before {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <span id="tip">make (something) suitable for a new use or purpose</span>
      <span>Adopt</span>
    </div>
  </body>
</html>
