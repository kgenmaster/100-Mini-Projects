<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Loading Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #FFFFFF;
        }
        .container {
            display: flex;
            justify-content: space-evenly;
        }
        .circle {
            margin: 10px;
            border-radius: 100%;
            background-color: white;
            width: 35px;
            height: 35px;
            animation: loading 800ms infinite ease-in-out;
        }
        .circle:nth-child(1) {
            animation-delay: 0.3s;
            background-color: #4285F4;
        }
        .circle:nth-child(2) {
            animation-delay: 0.4s;
            background-color: #EA4335;
        }
        .circle:nth-child(3) {
            animation-delay: 0.5s;
            background-color: #FBBC05;
        }
        .circle:nth-child(4) {
            background-color: #34A853;
        }

        @keyframes loading {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>
</body>
</html>
